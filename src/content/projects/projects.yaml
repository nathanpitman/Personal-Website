# Side projects. Set hidden: true to suppress an entry without deleting it.

- title: WordPress to Astro migration skill
  url: https://github.com/nathanpitman/wordpress-to-astro-migration-skill
  description: >-
    A Claude Code skill that migrates a live WordPress site to Astro from its
    public pages alone, with zero SEO impact. Rendered HTML is reproduced
    exactly as served. Outputs include an SEO fact inventory, Payload-shaped
    content maps and assets at their original URLs.
  hidden: false

- title: Canoncial Cave Adventure
  url: https://github.com/nathanpitman/CanonicalCaveAdventure
  description: >-
    CCA is a port of the classic text adventure "Adventure 2.5 / Open Adventure"
    but with a modern touch interface and an improved text parser. Created as an
    opportunity to explore what's possible with modern AI led development and a
    healthy dose of childhood nostalgia.
  hidden: false

- title: Open TTD renewable energy Mod
  url: https://github.com/nathanpitman/Open-TTD-Renewable-Energy-Mod
  description: >-
    Full energy economy mod for Open TTD which introduces nuclear and renewable
    energy sources over time, replacing coal power stations along with a mechanic
    that links energy production to town growth.
  hidden: false

- title: iHasco SCORM to PDF Transformer
  url: https://github.com/nathanpitman/iHasco-SCORM-to-PDF-Transformer
  description: >-
    A browser-based tool that extracts text from SCORM eLearning packages and
    converts them into readable PDFs. Built with Claude, with optional
    AI-powered prose rewriting via the Claude API. No install or backend
    required — runs entirely client-side.
  hidden: true

- title: Fedi Follow Catch
  url: https://nathanpitman.github.io/Fedi-Follow-Catch/
  description: >-
    A free, static, client-side-only tool that compares your Bluesky and Mastodon follow lists 
    - bridged via Bridgy Fed — and shows you who you follow on one network but not the other, 
    with a direct follow link for each gap.
  hidden: false

- title: Fuelwise
  url: https://fuelwise.replit.app
  description: >-
    A mobile-first web application (built with Replit) that helps UK drivers find
    the cheapest fuel prices nearby. Search by your current location, home
    postcode, or work postcode, and get directions to any station with one tap.
  hidden: true
